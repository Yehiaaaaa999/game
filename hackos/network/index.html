<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HackOS Desktop</title>
<style>
:root{
  --w1:#1d3b63; --w2:#0b1424; --win:#10161f; --bar:#243245; --ink:#d7e2ee; --green:#4ade80; --red:#ff5f56; --note:#ffe45c; --pop:#16202e;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--w1:#14284a; --w2:#060b14; --win:#0a0f16; --bar:#1b2635; --pop:#101926}}
:root[data-theme="dark"]{--w1:#14284a; --w2:#060b14; --win:#0a0f16; --bar:#1b2635; --pop:#101926}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--w2);color:var(--ink);font-family:"Space Mono","Courier New",ui-monospace,monospace;overflow:hidden;user-select:none}
#desk{position:relative;height:calc(100% - 44px);background:radial-gradient(circle at 30% 20%,var(--w1),var(--w2));overflow:hidden}
.wm{position:absolute;left:50%;top:48%;width:min(46vw,520px);transform:translate(-50%,-50%);opacity:.15;pointer-events:none;filter:drop-shadow(0 0 22px #6aa0ff66)}
#note{position:absolute;top:16px;right:20px;width:190px;padding:18px 14px;background:var(--note);color:#3b3000;font-family:"Comic Sans MS","Segoe Print",cursive;font-size:1.05rem;transform:rotate(2.5deg);box-shadow:4px 6px 14px #0008;z-index:1}
#note b{display:block;font-size:1.25rem;margin-top:6px}
#icons{position:absolute;top:16px;left:16px;display:grid;gap:14px;z-index:1}
.ico{background:none;border:0;color:var(--ink);font:inherit;font-size:.78rem;width:92px;padding:8px 4px;border-radius:6px;cursor:pointer;text-align:center}
.ico:hover,.ico:focus-visible{background:#ffffff22;outline:none}
.ico span{display:block;font-size:2.2rem;line-height:1.2}
.ico img{display:block;width:60px;height:60px;margin:0 auto 4px;object-fit:contain;filter:drop-shadow(2px 3px 0 #0006)}
.win{position:absolute;background:var(--win);border:1px solid #3d4f66;border-radius:8px;box-shadow:0 12px 36px #000a;display:flex;flex-direction:column;overflow:hidden}
.win[hidden]{display:none}
.tb{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--bar);cursor:grab;touch-action:none;font-size:.8rem}
.tb:active{cursor:grabbing}
.tb .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb button{width:22px;height:22px;border:0;border-radius:50%;background:#ffffff22;color:var(--ink);cursor:pointer;font:inherit;line-height:1;padding:0}
.tb button.x:hover{background:var(--red)}
.tb button:hover{background:#ffffff44}
.term{width:max(380px,40vw);height:max(260px,40vh)}
.tbody{flex:1;overflow:auto;padding:10px;font-size:.82rem;color:var(--green);user-select:text;cursor:text}
.out div{white-space:pre-wrap;word-break:break-word;min-height:1.3em}
.out .cmd{color:var(--ink)} .out .err{color:var(--red)} .out .ok{color:#7dd3fc} .out .dim{color:#7f8da0}
.in{display:flex;gap:6px}
.in input{flex:1;background:none;border:0;color:var(--ink);font:inherit;outline:none;min-width:0}
.pop{width:272px;border-color:#f6c945}
.win.ok{border-color:#4ade80}
.win.ok .tb{background:#12361f;color:#bbf7d0}
.pop .tb{background:#3a3112;color:#ffe9a3;font-size:.72rem;padding:6px 9px}
.pbody{padding:12px 13px;font-size:.76rem;line-height:1.5;background:var(--pop);user-select:text}
.pbody h4{margin:0 0 6px;font-size:.84rem;color:#ffd84d}
.pbody p{margin:0 0 8px}
.pbody small{color:#9fb0c3}
.pbody code{display:block;margin-top:6px;padding:6px 8px;background:#000;color:var(--green);border-radius:4px;word-break:break-all}
#bar{position:fixed;left:0;right:0;bottom:0;height:calc(44px + env(safe-area-inset-bottom,0px));padding:0 8px env(safe-area-inset-bottom,0px);display:flex;align-items:center;gap:6px;background:#0c121b;border-top:1px solid #3d4f66;z-index:5000}
#bar .logo{color:var(--green);font-weight:700;margin-right:8px}
#bar button{font:inherit;font-size:.75rem;color:var(--ink);background:var(--bar);border:1px solid #3d4f66;border-radius:5px;padding:6px 12px;cursor:pointer;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bar button.min{opacity:.55;border-style:dashed}
#bar button:focus-visible,.tb button:focus-visible{outline:2px solid var(--green)}
#ov{position:fixed;inset:0;z-index:9000;background:#000;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--green)}
#ov[hidden]{display:none}
#ov canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.35}
#ov .box{position:relative;border:3px dashed var(--green);padding:36px 28px;background:#000c;max-width:720px;box-shadow:0 0 40px #4ade8066}
#ov h1{font-size:clamp(1.8rem,6vw,3.4rem);margin:0 0 14px;text-shadow:0 0 14px var(--green);animation:gl 1.4s infinite}
#ov p{margin:6px 0;font-size:.95rem}
#ov .eth{color:#7f8da0;font-size:.75rem;margin-top:18px}
#ov button{margin-top:18px;font:inherit;font-weight:700;padding:10px 22px;background:var(--green);color:#000;border:0;border-radius:4px;cursor:pointer}
@keyframes gl{0%,92%,100%{transform:none}94%{transform:translate(-3px,1px);color:#fff}96%{transform:translate(3px,-1px);color:#f0f}}
@media(prefers-reduced-motion:reduce){#ov h1{animation:none}}
</style>
</head>

    tb.onpointermove=function(v){
      el.style.left=Math.max(0,Math.min(v.clientX-dx,innerWidth-80))+"px";
      el.style.top=Math.max(0,Math.min(v.clientY-dy,innerHeight-120))+"px";
    };
    tb.onpointerup=function(){tb.onpointermove=null};
  };
  wins[id]=w; return w;
}

    var l=lines[i++], d=document.createElement("div");

    t.body.scrollTop=t.body.scrollHeight; setTimeout(n,gap||130);

}

function openApp(id){
